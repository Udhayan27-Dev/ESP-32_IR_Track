
; PlatformIO Project Configuration File for ESP-32
; Project: 6-Junction IR & LED Bot Tracking System
; Framework: Arduino on ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 115200

; Compiler options
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -I include

lib_deps = 
    wayoda/LedControl @ ^1.0.6